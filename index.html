<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reading Quest</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#eefaff,#fff3d7);color:#20314d}header{position:sticky;top:0;z-index:9;background:#263858;color:#fff;padding:10px 16px;display:flex;gap:12px;align-items:center}.progress{flex:1;height:10px;background:#56657d;border-radius:20px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#35c5d2,#f0629b,#ffc344)}main{max-width:1100px;margin:auto;padding:18px 18px 80px}.screen{display:none}.screen.on{display:block}.card{background:#fff;border-radius:26px;padding:22px;box-shadow:0 15px 45px #20304a1c}.map{position:relative}.map img{width:100%;border-radius:22px;display:block}.hot{position:absolute;border:0;border-radius:25px;background:#ffffff20;cursor:pointer}.hot:hover{outline:5px solid #fff8}.m1{left:7%;top:33%;width:31%;height:27%}.m2{left:38%;top:27%;width:30%;height:30%}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.hero{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:22px}.people{display:grid;grid-template-columns:1fr 1fr;gap:12px}.people.three{grid-template-columns:repeat(3,1fr)}.person{text-align:center}.person img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:18px}.task{padding:14px;border:1px solid #dce6f0;background:#f8fbff;border-radius:14px;margin:12px 0}.line{padding:10px 12px;background:#f5f1ff;border-radius:12px;margin:7px 0;font-size:18px}.btn{border:0;border-radius:11px;padding:11px 14px;margin:4px;background:#6d55df;color:white;font-weight:bold;cursor:pointer}.green{background:#2ba56b}.grey{background:#697588}.orange{background:#ed8b37}.nav{display:flex;justify-content:space-between;margin-top:18px}.choice{display:block;padding:9px;background:#fff;border:1px solid #d4dfeb;border-radius:9px;margin:6px 0}select,input[type=text]{padding:9px;border:1px solid #cbd7e5;border-radius:9px;font:inherit}.fb{padding:11px;margin-top:8px;border-left:5px solid #36b9c8;background:#ecf9ff}.ok{border-color:#2ba56b;background:#eaf8ef}.bad{border-color:#d94b5d;background:#fff0f1}.word{font-size:28px;font-weight:bold}.letters{letter-spacing:5px;font-size:25px}.stars{font-weight:bold}.tag{display:inline-block;padding:5px 9px;background:#eee9ff;border-radius:12px;margin:3px}h1{font-size:clamp(38px,6vw,68px);margin:.2em 0}@media(max-width:760px){.grid{grid-template-columns:1fr}.m1,.m2{height:25%}}

.questMapWrap{position:relative;max-width:1050px;margin:auto}
.questMapWrap>img{width:100%;display:block;border-radius:28px;box-shadow:0 18px 48px #20304a2b}
.mapHot{position:absolute;top:35%;height:31%;border:0;background:transparent;cursor:pointer;border-radius:24px}
.mapHot:hover{background:#ffffff22;box-shadow:0 0 0 5px #fff8}
.mh1{left:3%;width:22%}.mh2{left:27%;width:22%}.mh3{left:51%;width:22%}.mh4{left:75%;width:22%}
.colorHero{width:100%;max-height:480px;object-fit:contain;border-radius:24px;background:#f7fbff;box-shadow:0 10px 28px #20304a18}
.pictureStrip{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:16px 0}
.pictureStrip .person{background:#fff;border-radius:20px;padding:9px;box-shadow:0 8px 22px #20304a16;text-align:center}
.pictureStrip img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:16px}
@media(max-width:760px){.pictureStrip{grid-template-columns:1fr}.mapHot{top:34%;height:33%}}

function show(){document.querySelectorAll('.screen').forEach((x,i)=>x.classList.toggle('on',i===cur));prog.style.width=((cur+1)/pages.length*100)+'%';count.textContent=(cur+1)+'/'+pages.length;stars.textContent=score+' ⭐';if(cur===pages.length-1)final.innerHTML=`<div class="fb ok"><b>${score} ⭐</b><br>Read the dialogues and texts aloud once more.</div>`;scrollTo(0,0)}function go(d){stopSpeech();cur=Math.max(0,Math.min(pages.length-1,cur+d));show()}function map(){stopSpeech();cur=0;show()}function jumpMission(n){stopSpeech();let a=[...document.querySelectorAll('.screen')];cur=a.findIndex(x=>x.dataset.mission==n);show()}let speechToken=0, paused=false;
function makeUtterance(t,onend=null){let u=new SpeechSynthesisUtterance(String(t));u.lang='en-GB';u.rate=.72;u.pitch=1;if(onend)u.onend=onend;return u}
function say(t){speechToken++;paused=false;speechSynthesis.cancel();setTimeout(()=>speechSynthesis.speak(makeUtterance(t)),120)}
function speakSequence(arr){speechToken++;let token=speechToken;paused=false;speechSynthesis.cancel();let i=0;function next(){if(token!==speechToken||i>=arr.length)return;let u=makeUtterance(arr[i++],()=>setTimeout(next,220));speechSynthesis.speak(u)}setTimeout(next,150)}
function togglePause(btn){if(speechSynthesis.paused){speechSynthesis.resume();paused=false;btn.textContent='⏸ PAUSE'}else if(speechSynthesis.speaking){speechSynthesis.pause();paused=true;btn.textContent='▶ RESUME'}}
function stopSpeech(){speechToken++;paused=false;speechSynthesis.cancel()}
function award(k,n,ok){if(ok&&!done.has(k)){score+=n;done.add(k);stars.textContent=score+' ⭐'}}function fb(id,ok,msg=''){document.getElementById(id).innerHTML=`<div class="fb ${ok?'ok':'bad'}">${ok?'✓ Great!':'✗ Try again.'} ${msg}</div>`}
