function show(){document.querySelectorAll('.screen').forEach((x,i)=>x.classList.toggle('on',i===cur));prog.style.width=((cur+1)/pages.length*100)+'%';count.textContent=(cur+1)+'/'+pages.length;stars.textContent=score+' ⭐';if(cur===pages.length-1)final.innerHTML=`<div class="fb ok"><b>${score} ⭐</b><br>Read the dialogues and texts aloud once more.</div>`;scrollTo(0,0)}function go(d){stopSpeech();cur=Math.max(0,Math.min(pages.length-1,cur+d));show()}function map(){stopSpeech();cur=0;show()}function jumpMission(n){stopSpeech();let a=[...document.querySelectorAll('.screen')];cur=a.findIndex(x=>x.dataset.mission==n);show()}let speechToken=0, paused=false;
function makeUtterance(t,onend=null){let u=new SpeechSynthesisUtterance(String(t));u.lang='en-GB';u.rate=.72;u.pitch=1;if(onend)u.onend=onend;return u}
function say(t){speechToken++;paused=false;speechSynthesis.cancel();setTimeout(()=>speechSynthesis.speak(makeUtterance(t)),120)}
function speakSequence(arr){speechToken++;let token=speechToken;paused=false;speechSynthesis.cancel();let i=0;function next(){if(token!==speechToken||i>=arr.length)return;let u=makeUtterance(arr[i++],()=>setTimeout(next,220));speechSynthesis.speak(u)}setTimeout(next,150)}
function togglePause(btn){if(speechSynthesis.paused){speechSynthesis.resume();paused=false;btn.textContent='⏸ PAUSE'}else if(speechSynthesis.speaking){speechSynthesis.pause();paused=true;btn.textContent='▶ RESUME'}}
function stopSpeech(){speechToken++;paused=false;speechSynthesis.cancel()}
function award(k,n,ok){if(ok&&!done.has(k)){score+=n;done.add(k);stars.textContent=score+' ⭐'}}function fb(id,ok,msg=''){document.getElementById(id).innerHTML=`<div class="fb ${ok?'ok':'bad'}">${ok?'✓ Great!':'✗ Try again.'} ${msg}</div>`}
